[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsize-fastmail"
version = "0.1.0"
description = "Fastmail JMAP client: mailbox listing, paginated message fetch, and delta sync, with no database or web-framework assumptions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Capsize LLC", email = "contact@capsizegames.com" },
]
keywords = [
    "fastmail",
    "jmap",
    "email",
    "imap-alternative",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/capsize-games/capsize-fastmail"
Issues = "https://github.com/capsize-games/capsize-fastmail/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capsize_fastmail = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
